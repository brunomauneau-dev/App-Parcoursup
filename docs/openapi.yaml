openapi: 3.1.0
info:
  title: API de consultation du dossier candidat (proposition)
  version: 0.1.0
  description: |
    Proposition de contrat pour l'application mobile de consultation Parcoursup,
    à discuter avec le SCN Parcoursup.

    Principes :
    - **Lecture seule.** L'API n'expose que des opérations GET. Toute autre méthode
      sur `/v1/*` répond 405. Aucune action sur le dossier n'est possible.
    - **Jeton limité.** Les jetons d'accès portent le seul périmètre `dossier.read`
      et ne donnent accès qu'au dossier de leur titulaire.
    - **Données minimales.** Ni notes, ni bulletins, ni données de santé, de handicap
      ou de bourse.

    Un serveur de démonstration conforme à ce contrat est fourni dans `server/`.
servers:
  - url: http://localhost:4000
    description: Serveur de démonstration (données fictives)

tags:
  - name: Authentification
  - name: Consultation

paths:
  /oauth/authorize:
    get:
      tags: [Authentification]
      summary: Page de connexion (ouverte dans le navigateur du téléphone)
      description: |
        L'application ouvre cette page dans le navigateur système (RFC 8252). Le candidat y
        saisit son mot de passe puis le code de vérification de la double authentification
        (l'application ne voit ni l'un ni l'autre), puis autorise l'application : un écran
        liste ce qu'elle pourra consulter et ce qu'elle ne pourra pas faire. Un refus renvoie
        `error=access_denied`. En fin de parcours, le serveur redirige vers
        `redirect_uri` avec un code d'autorisation à usage unique (60 s) et le `state` reçu.
        Les adresses de retour sont enregistrées à l'avance ; une adresse inconnue est refusée
        sans redirection.
      parameters:
        - { name: response_type, in: query, required: true, schema: { const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string, example: suivi-voeux-mobile } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, example: 'suivivoeux://connexion' } }
        - { name: scope, in: query, schema: { const: dossier.read } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string }, description: 'BASE64URL(SHA256(code_verifier))' }
        - { name: code_challenge_method, in: query, required: true, schema: { const: S256 } }
      responses:
        '200': { description: Page de connexion (HTML) }
        '302': { description: Retour vers l'application avec `code` et `state`, ou `error` }
        '400': { description: Client ou adresse de retour inconnus }

  /oauth/token:
    post:
      tags: [Authentification]
      summary: Obtenir ou renouveler un jeton
      description: |
        - `grant_type=authorization_code` : échange du code reçu en fin de connexion, avec le
          `code_verifier` PKCE. Le code est à usage unique, même en cas d'échec.
        - `grant_type=refresh_token` : renouvellement. Chaque jeton de renouvellement
          est à usage unique ; sa réutilisation révoque toute la session.

        Le flux `password` (mot de passe saisi dans l'application) n'est pas accepté.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DemandeCode'
                - $ref: '#/components/schemas/DemandeRenouvellement'
      responses:
        '200':
          description: Jeton émis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReponseJeton' }
        '400':
          description: Code, vérificateur PKCE ou jeton de renouvellement invalide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErreurOAuth' }
        '401':
          description: Client inconnu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErreurOAuth' }
        '429':
          description: Trop de tentatives de connexion (limite par adresse IP)
          headers:
            Retry-After: { schema: { type: integer }, description: Délai en secondes }

  /oauth/revoke:
    post:
      tags: [Authentification]
      summary: Révoquer une session (déconnexion)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, client_id]
              properties:
                token: { type: string, description: Jeton de renouvellement }
                token_type_hint: { type: string, enum: [refresh_token] }
                client_id: { type: string }
      responses:
        '200': { description: Session révoquée (réponse identique si le jeton est inconnu) }

  /v1/dossier:
    get:
      tags: [Consultation]
      summary: Consulter son dossier
      description: |
        Renvoie les vœux du candidat titulaire du jeton, avec leur statut, le rang en
        liste d'attente, son historique et les dates limites de réponse.
        Les données changent au plus une fois par nuit : la réponse peut être préparée
        à l'avance et mise en cache côté serveur.
      security: [{ jeton: [dossier.read] }]
      responses:
        '200':
          description: Dossier du candidat
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dossier' }
        '401':
          description: Jeton absent, expiré ou révoqué
          headers:
            WWW-Authenticate: { schema: { type: string } }
        '405': { description: Méthode refusée (API en lecture seule) }
        '429': { description: Service saturé, réessayer plus tard }
        '503': { description: Service indisponible (maintenance, recalcul nocturne) }

components:
  securitySchemes:
    jeton:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            dossier.read: Consultation du dossier, sans aucune action possible

  schemas:
    DemandeCode:
      type: object
      required: [grant_type, client_id, code, redirect_uri, code_verifier]
      properties:
        grant_type: { const: authorization_code }
        client_id: { type: string, example: suivi-voeux-mobile }
        code: { type: string, description: Code d'autorisation reçu sur l'adresse de retour }
        redirect_uri: { type: string, description: Identique à celle de la demande }
        code_verifier: { type: string, description: Secret PKCE gardé par l'application }

    DemandeRenouvellement:
      type: object
      required: [grant_type, client_id, refresh_token]
      properties:
        grant_type: { const: refresh_token }
        client_id: { type: string }
        refresh_token: { type: string }

    ReponseJeton:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token: { type: string }
        token_type: { const: Bearer }
        expires_in: { type: integer, description: Durée de vie en secondes, example: 300 }
        refresh_token: { type: string, description: À usage unique }
        scope: { const: dossier.read }

    ErreurOAuth:
      type: object
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, invalid_scope, unsupported_grant_type]

    Dossier:
      type: object
      required: [prenom, numeroDossier, derniereMiseAJour, dateServeur, voeux]
      properties:
        prenom: { type: string }
        numeroDossier: { type: string }
        derniereMiseAJour:
          type: string
          format: date-time
          description: Date de la dernière mise à jour du dossier (recalcul nocturne)
        dateServeur:
          type: string
          format: date-time
          description: Heure du serveur. Sert aux comptes à rebours, indépendamment de l'horloge du téléphone.
        voeux:
          type: array
          items: { $ref: '#/components/schemas/Voeu' }
        avantPhase:
          type: boolean
          description: Compte lié avant le début de la phase d'admission (application en veille). `voeux` est vide.
        resultatsAttendus:
          type: boolean
          description: |
            Premier jour de la phase : vrai tant que le SCN n'a pas ouvert la publication des résultats.
            `voeux` est alors vide : l'application ne montre jamais un résultat avant le site.
        coordonnees:
          type: object
          description: Coordonnées où Parcoursup envoie ses alertes, masquées (le candidat vérifie qu'elles sont justes).
          properties:
            mail: { type: string, example: 'c•••@exemple.fr' }
            telephone: { type: string, example: '06 •• •• •• 12' }
        classementAttente:
          type: object
          description: Période où le candidat doit classer ses vœux en attente sur le site (calendrier 2027 du 4 au 7 juin).
          properties:
            debut: { type: string, format: date-time }
            fin: { type: string, format: date-time }
            fait: { type: boolean, description: Vrai si le candidat a déjà classé ses vœux (plus de rappel) }

    Voeu:
      type: object
      required: [id, formation, etablissement, ville, statut]
      properties:
        id: { type: string }
        formation: { type: string, example: BUT Informatique }
        etablissement: { type: string, example: IUT de Nantes }
        ville: { type: string }
        statut:
          type: string
          enum: [proposition, proposition_acceptee, en_attente, refuse, refusee_par_candidat]
          description: |
            `refuse` : réponse négative de l'établissement.
            `refusee_par_candidat` : proposition refusée par le candidat.
        rang:
          type: integer
          description: Position actuelle dans la liste d'attente, parmi les candidats encore en attente (statut en_attente). Évolue chaque jour.
        rangClassement:
          type: integer
          description: Rang du candidat dans le classement de la formation (ordre d'appel). Fixe. Seul ce rang se compare à rangDernierAppeleAnneePrecedente.
        totalEnAttente: { type: integer }
        places: { type: integer }
        rangDernierAppeleAnneePrecedente:
          type: integer
          description: Rang de classement du dernier candidat ayant reçu une proposition l'an dernier
        historique:
          type: array
          description: Rang à chaque mise à jour nocturne depuis le début de la phase
          items:
            type: object
            required: [date, rang]
            properties:
              date: { type: string, format: date-time }
              rang: { type: [integer, 'null'] }
        ouiSi:
          type: boolean
          description: Réponse « Oui-si » (surtout en licence) : admission avec un accompagnement pour réussir. Le détail de l'accompagnement est décrit dans la fiche de la formation.
        dateProposition: { type: string, format: date-time }
        dateLimiteReponse:
          type: string
          format: date-time
          description: Date limite de réponse à la proposition (statut proposition)
